name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run tests with coverage
        shell: bash
        run: |
          report_directory="$GITHUB_WORKSPACE/ci-reports/${{ matrix.workspace }}-unit"
          mkdir -p "$report_directory"
          set +e
          if [ "${{ matrix.workspace }}" = "backend" ]; then
            pnpm --filter @elderflow/backend exec jest --coverage --runInBand --json --outputFile="$report_directory/test-results.json" --coverageReporters=json-summary --coverageReporters=text
            test_exit=$?
            coverage_summary="$GITHUB_WORKSPACE/backend/coverage/coverage-summary.json"
          else
            pnpm --filter @elderflow/frontend exec vitest run --coverage --reporter=json --outputFile="$report_directory/test-results.json" --coverage.reporter=json-summary --coverage.reporter=text
            test_exit=$?
            coverage_summary="$GITHUB_WORKSPACE/frontend/coverage/coverage-summary.json"
          fi
          set -e
          printf '{"exitCode":%s}\n' "$test_exit" > "$report_directory/status.json"
          if [ -f "$coverage_summary" ]; then
            cp "$coverage_summary" "$report_directory/coverage-summary.json"
          fi
          exit "$test_exit"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-${{ matrix.workspace }}-unit
          path: ci-reports/${{ matrix.workspace }}-unit
          if-no-files-found: warn

  e2e:
    name: Backend e2e (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: elderflow
          POSTGRES_USER: elderflow
          POSTGRES_PASSWORD: elderflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elderflow -d elderflow"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://elderflow:elderflow@localhost:5432/elderflow
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run e2e tests
        shell: bash
        run: |
          report_directory="$GITHUB_WORKSPACE/ci-reports/backend-e2e"
          mkdir -p "$report_directory"
          set +e
          pnpm --filter @elderflow/backend exec jest --config test/jest-e2e.json --runInBand --json --outputFile="$report_directory/test-results.json"
          test_exit=$?
          set -e
          printf '{"exitCode":%s}\n' "$test_exit" > "$report_directory/status.json"
          exit "$test_exit"
      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-backend-e2e
          path: ci-reports/backend-e2e
          if-no-files-found: warn

  syntax:
    name: Syntax and build (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @elderflow/${{ matrix.workspace }} build

  badge-tooling:
    name: Badge tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm run test:ci-badges
      - name: Validate GitHub Actions workflow
        uses: docker://rhysd/actionlint:1.7.7

  publish-badges:
    name: Publish badges
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [tests, e2e, syntax, badge-tooling]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download backend unit report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-report-backend-unit
          path: ci-reports/backend-unit
      - name: Download frontend unit report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-report-frontend-unit
          path: ci-reports/frontend-unit
      - name: Download backend e2e report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-report-backend-e2e
          path: ci-reports/backend-e2e
      - name: Generate badge data
        run: |
          node scripts/generate-ci-badges.mjs \
            --reports ci-reports \
            --output "$RUNNER_TEMP/generated-badges" \
            --sha "$GITHUB_SHA" \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Publish badge data
        shell: bash
        run: |
          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$latest_sha" = "$GITHUB_SHA"

          git fetch origin badges:refs/remotes/origin/badges || true
          badge_worktree="$RUNNER_TEMP/badges-branch"
          if git rev-parse --verify refs/remotes/origin/badges >/dev/null 2>&1; then
            git worktree add --detach "$badge_worktree" refs/remotes/origin/badges
          else
            git worktree add --detach "$badge_worktree" "$GITHUB_SHA"
            git -C "$badge_worktree" switch --orphan badges
          fi

          rsync -a --delete --exclude .git "$RUNNER_TEMP/generated-badges/" "$badge_worktree/"
          git -C "$badge_worktree" add --all
          if git -C "$badge_worktree" diff --cached --quiet; then
            exit 0
          fi

          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$latest_sha" = "$GITHUB_SHA"
          git -C "$badge_worktree" config user.name "github-actions[bot]"
          git -C "$badge_worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$badge_worktree" commit -m "chore: update badges for $GITHUB_SHA"
          git -C "$badge_worktree" push origin HEAD:badges
